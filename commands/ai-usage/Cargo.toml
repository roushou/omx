[package]
name = "ai-usage-commands"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[package.metadata.omega]
kind = "command-host"

[dependencies]
chrono = "0.4"
libc = "0.2"
omega.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
