[workspace]
resolver = "3"
members = ["crates/*", "plugins/*", "system"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
omega = { version = "0.3.9", package = "omega-rs" }
omega-document = "0.3.9"
omega-omarchy = "0.3.9"
omega-preview = "0.3.9"
omega-proto = "0.3.9"

[profile.release]
strip = true
lto = "thin"
