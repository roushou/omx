[package]
name = "ai-usage"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
chrono = "0.4"
desktop-ui = { path = "../../crates/desktop-ui" }
libc = "0.2"
omega.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt", "sync"] }

[dev-dependencies]
omega-preview.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
